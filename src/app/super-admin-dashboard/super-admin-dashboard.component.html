<!-- User Management Section -->
<div class="user-management">
  <h1>User Management</h1>

  <!-- Table to Display Users -->
  <table>
    <thead>
      <tr>
        <th>Username</th>
        <th>Password</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.Username }}</td>
        <td>{{ user.Password }}</td>
        <td>{{ user.Role }}</td>
        <td>
          <!-- Edit Button -->
          <button (click)="editUser(user)">Edit</button>
          
          <!-- Delete Button -->
          <button (click)="prepareDeleteUser(user.Username)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Edit Form -->
  <div *ngIf="selectedUser" class="edit-form">
    <h2>Edit User</h2>
    <form (ngSubmit)="updateUser()">
      <label>
        Username:
        <input type="text" [(ngModel)]="selectedUser.Username" name="username" required />
      </label>
      <label>
        Password:
        <input type="text" [(ngModel)]="selectedUser.Password" name="password" required />
      </label>
      <label>
        Role:
        <select [(ngModel)]="selectedUser.Role" name="role" required>
          <option value="admin">Admin</option>
          <option value="staff">Staff</option>
        </select>
      </label>
      <button type="submit">Save Changes</button>
      <button type="button" (click)="cancelEdit()">Cancel</button>
    </form>
  </div>

  <!-- Confirmation Modal for User Deletion -->
  <div *ngIf="showConfirmDialog" class="confirmation-modal">
    <div class="modal-content">
      <h3>Are you sure you want to delete this user?</h3>
      <button (click)="confirmDeleteUsers()">Confirm</button>
      <button (click)="cancelDeleteUsers()">Cancel</button>
    </div>
  </div>

  <div *ngIf="successMessage" class="success-message">
    <i class="fas fa-check-circle"></i> <!-- Font Awesome Checkmark Icon -->
    <p>{{ successMessage }}</p>
  </div>
  

</div>
